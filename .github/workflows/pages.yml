# main への push で、検査・テスト・ビルドを行い GitHub Pages へデプロイする。
# - アクションはすべて GitHub 公式（actions/）で、コミット SHA で固定する（行末は対応するタグ）
# - 追加のトークン・Secrets・外部サービスは使わない
# - 実ファイル検証（test:real）は IFILTER_REAL_PATH が無いためスキップされる
# - 実データの検索語を使う check:public は CI では実行しない（手元専用）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:domains

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # base_path はプロジェクトページなら "/<リポジトリ名>"、ユーザーページや独自ドメインなら ""
      - run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
      - run: npm run check:dist
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
